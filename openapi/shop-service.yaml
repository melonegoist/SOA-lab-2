openapi: 3.0.3
info:
  title: Shop Service API
  description: |
    Service providing additional operations over vehicles.
  version: 1.0.0
servers:
  - url: https://localhost:28681/shop-service
    description: |
      Local Payara domain, or helios through an SSH tunnel that keeps
      the same port number.
  - url: https://helios.cs.ifmo.ru:28681/shop-service
    description: helios directly, from the university network.
tags:
  - name: Shop
    description: Application-level operations over vehicles.
paths:
  /shop/search/by-type/{type}:
    get:
      tags:
        - Shop
      summary: Find vehicles of a given type
      description: |
        Returns every vehicle whose type field equals the value supplied
        in the request path.

        The comparison is exact and case-sensitive: the value must match
        one of the members of the VehicleType enumeration. A value outside
        the enumeration results in 400 Bad Request.
      operationId: searchVehiclesByType
      parameters:
        - name: type
          in: path
          required: true
          description: Vehicle type.
          schema:
            $ref: '#/components/schemas/VehicleType'
          example: CHOPPER
      responses:
        '200':
          description: List of vehicles of the given type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '400':
          description: The supplied value is not a member of the VehicleType enumeration.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /shop/fix-distance/{vehicle-id}:
    post:
      tags:
        - Shop
      summary: Reset the odometer
      description: |
        Sets the mileage field of the vehicle with the given identifier
        to zero.

        When the mileage of the vehicle was not specified, the operation
        sets it to zero as well.
      operationId: fixVehicleDistance
      parameters:
        - name: vehicle-id
          in: path
          required: true
          description: Vehicle identifier.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 42
      responses:
        '200':
          description: The odometer has been reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          description: The identifier is malformed or non-positive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No vehicle with the given identifier exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    InternalServerError:
      description: Internal service error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    VehicleType:
      type: string
      description: Vehicle type.
      enum:
        - HELICOPTER
        - MOTORCYCLE
        - CHOPPER
        - SPACESHIP
      example: CHOPPER
    Coordinates:
      type: object
      description: Vehicle coordinates on a plane.
      required:
        - x
        - 'y'
      properties:
        x:
          type: integer
          format: int32
          description: X coordinate. Must not exceed 471.
          maximum: 471
          example: 120
        'y':
          type: integer
          format: int32
          description: Y coordinate.
          example: -47
      additionalProperties: false
    NullableVehicleType:
      type: string
      description: Vehicle type. The value may be absent.
      nullable: true
      enum:
        - HELICOPTER
        - MOTORCYCLE
        - CHOPPER
        - SPACESHIP
        - null
      example: CHOPPER
    NullableFuelType:
      type: string
      description: Fuel type. The value may be absent.
      nullable: true
      enum:
        - GASOLINE
        - ELECTRICITY
        - MANPOWER
        - ANTIMATTER
        - null
      example: ELECTRICITY
    Vehicle:
      type: object
      description: Complete representation of a vehicle. The id and creationDate fields are generated by the server.
      required:
        - id
        - name
        - coordinates
        - creationDate
        - enginePower
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier. Generated by the server.
          minimum: 1
          readOnly: true
          example: 42
        name:
          type: string
          description: Vehicle name. Must not be empty.
          minLength: 1
          pattern: '^\s*\S[\s\S]*$'
          example: Tesla Roadster
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          description: Moment of creation in RFC 3339 format. Generated by the server.
          readOnly: true
          example: '2026-09-10T08:19:00+03:00'
        enginePower:
          type: number
          format: float
          description: Engine power. Strictly greater than zero.
          minimum: 0
          exclusiveMinimum: true
          example: 615.5
        numberOfWheels:
          type: integer
          format: int32
          description: Number of wheels. Strictly greater than zero when present, may be absent.
          minimum: 1
          nullable: true
          example: 4
        mileage:
          type: number
          format: double
          description: 'Mileage in kilometres. Must not be negative, may be absent. Zero is a valid value.'
          minimum: 0
          nullable: true
          example: 15320.7
        type:
          $ref: '#/components/schemas/NullableVehicleType'
        fuelType:
          $ref: '#/components/schemas/NullableFuelType'
    ValidationError:
      type: object
      description: Violation of a constraint on a particular field.
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Path to the field in JSON Pointer notation without the leading slash.
          example: coordinates/x
        message:
          type: string
          description: Description of the violated constraint.
          example: The value must not exceed 471.
    Problem:
      type: object
      description: Error description in RFC 9457 format (Problem Details for HTTP APIs).
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the error type.
          default: about:blank
          example: https://example.org/problems/validation-failed
        title:
          type: string
          description: Short human-readable summary of the error type.
          example: Validation failed
        status:
          type: integer
          format: int32
          description: HTTP status code of the response, duplicated in the body.
          minimum: 100
          maximum: 599
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: Engine power must be greater than zero.
        instance:
          type: string
          format: uri-reference
          description: URI of the request that produced the error.
          example: /vehicles
        errors:
          type: array
          description: 'Extension to the standard: per-field breakdown. Present when integrity constraints are violated.'
          items:
            $ref: '#/components/schemas/ValidationError'
