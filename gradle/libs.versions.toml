# Versions are pinned by the helios environment, not by preference:
# JDK 17 there rules out Payara 7 (needs JDK 21), Payara 6 implements
# Jakarta EE 10 (Servlet 6.0), and Spring Framework 7 / Boot 4 require
# Servlet 6.1. Hence Payara 6 + Spring Boot 3.5, the last lines that fit.
[versions]
jakartaee = "10.0.0"
payara = "6.2025.11"
spring-boot = "3.5.16"
postgresql = "42.7.13"
openapi-generator = "7.25.0"
# The Jackson bundled in Payara 6.2025.11 (final Payara 6 release, so it
# never moves). vehicle-service uses the server's copy, see its build file.
payara-jackson = "2.20.0"
# Also bundled in Payara 6.2025.11; compile-only.
payara-jersey = "3.1.11"
microprofile-config = "3.1"
flyway = "13.8.0"
junit = "6.1.3"
assertj = "3.27.7"
swagger-request-validator = "2.46.1"
swagger-ui = "5.32.15"

[libraries]
jakartaee-web-api = { module = "jakarta.platform:jakarta.jakartaee-web-api", version.ref = "jakartaee" }
payara-web = { module = "fish.payara.distributions:payara-web", version.ref = "payara" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
payara-jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "payara-jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jersey-server = { module = "org.glassfish.jersey.core:jersey-server", version.ref = "payara-jersey" }
jersey-media-json-jackson = { module = "org.glassfish.jersey.media:jersey-media-json-jackson", version.ref = "payara-jersey" }
microprofile-config-api = { module = "org.eclipse.microprofile.config:microprofile-config-api", version.ref = "microprofile-config" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
swagger-request-validator = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swagger-request-validator" }
webjars-swagger-ui = { module = "org.webjars:swagger-ui", version.ref = "swagger-ui" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
spring-test = { module = "org.springframework:spring-test" }

[plugins]
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
